- id: leave-policy
  type: answerable
  question: "How many vacation days do employees get after 2 years?"
  must_contain:
    - "15"
  expected_doc: "sample-hr-policy.md"

- id: parental-leave
  type: answerable
  question: "What is the parental leave policy?"
  must_contain:
    - "12 weeks"
  expected_doc: "sample-hr-policy.md"

- id: error-code
  type: keyword
  question: "What does error ERR-4402 mean?"
  must_contain:
    - "ERR-4402"
  expected_doc: "sample-runbook.md"

- id: unknown-salary
  type: unanswerable
  question: "What is Alice's salary?"
  must_contain:
    - "couldn't find"
